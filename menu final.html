<!DOCTYPE html>
<html>
<head>
    <title>Cafeteria Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: pink;
            text-align: center;
        }

        h1 {
            color: brown;
        }
        hr {
            width: 70%;
            border: 1px solid brown;
        }


        .menu {
            display: grid;
            grid-template-columns: 200px 200px;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .item {
            background-color: white;
            width: 160px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        .item h2 {
            color: brown;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: blue;
        }

        button {
            background-color: brown;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: brown;
        }
    </style>
</head>
